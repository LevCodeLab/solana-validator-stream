[package]
name = "solana-validator-stream"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "In-process Agave Geyser plugin and Unix Domain Socket NDJSON streamer for low-latency Solana validator events"
repository = "https://github.com/LevCodeLab/solana-validator-stream"
keywords = ["solana", "agave", "geyser", "validator", "uds"]
categories = ["network-programming"]

[lib]
name = "solana_validator_stream"
crate-type = ["cdylib", "rlib"]

[dependencies]
agave-geyser-plugin-interface = "4.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-clock = "3.2.0"
thiserror = "1.0"
tokio = { version = "1.36", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
